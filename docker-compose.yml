# Dev stack: every service runs with live reloading.
# Laravel serves the SPA in production; in dev the Nuxt dev server does, so
# that HMR works, and nginx routes /api to Octane. See nginx/nginx.dev.conf.

services:
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    restart: always
    working_dir: /nginx
    ports:
      - "8080:80"
      - "1935:1935"
    volumes:
      - ./nginx/nginx.dev.conf:/opt/nginx/conf/nginx.conf
      - ./backend:/backend
    depends_on:
      - php
      - nuxt
  echo:
    build:
      context: ./echo
      dockerfile: Dockerfile
    restart: always
    working_dir: /echo
  tusd:
    image: tusproject/tusd:v2
    command: -verbose -behind-proxy -port=1080 -base-path /api/files -upload-dir=/backend/storage/temp-uploads -hooks-http http://php:4002/api/internal/tus
    volumes:
      - ./backend:/backend
  php:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    working_dir: /backend
    command: bash -c "printenv > /etc/environment && service cron start && php artisan octane:start --watch --server=swoole --host=0.0.0.0 --port=4002"
    volumes:
      - ./backend:/backend
      # Keeps the image's node_modules (chokidar, for octane --watch) visible
      # through the bind mount above.
      - /backend/node_modules
    env_file:
      - .env
  nuxt:
    image: node:20
    working_dir: /backend/resources/js
    command: sh -c "npm install && npm run dev"
    volumes:
      - ./backend/resources/js:/backend/resources/js
      - /backend/resources/js/node_modules
    environment:
      - NUXT_HMR_CLIENT_PORT=8080
    depends_on:
      - php
  queue:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    working_dir: /backend
    command: bash -c "php artisan queue:work"
    volumes:
      - ./backend:/backend
    env_file:
      - .env
    depends_on:
      - php
  mysql:
    image: mysql:8.0.31-debian
    restart: always
    environment:
      - MYSQL_DATABASE=${DB_DATABASE:-app}
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD:-password}
    volumes:
      - ./dbdata:/var/lib/mysql
  redis:
    image: redis:7.0.7-bullseye
    restart: always
volumes:
  dbdata:
    driver: local
networks:
  app-network:
    driver: bridge

# Streaming edge. Owns RTMP ingest, live HLS, VOD packaging and resumable
# uploads. It never talks to php-fpm, MySQL or Redis directly: every callback
# into the application goes to ${APP_INTERNAL_URL} over plain HTTP, which the
# entrypoint substitutes at container start.
#
# Both ends identify each other by address: the application allowlists this
# server in config/servers.php, and INTERNAL_ALLOW below allowlists the
# application. Neither depends on a shared private network, only on the two
# having stable addresses.
#
# There is one config rather than a dev/prod pair -- nothing here differs
# between the two.

worker_processes  1;

events {
	worker_connections  1024;
}

http {
	include       mime.types;
	default_type  application/octet-stream;
	access_log off;
	sendfile        on;
	keepalive_timeout  65;

	server {
		listen       80;
		server_name  localhost;
		root         /app/public;
		client_max_body_size 0;
		error_page   500 502 503 504  /50x.html;

		location = /50x.html {
			root   html;
		}

		# Resumable uploads. tusd stores parts under
		# /app/storage/temp-uploads and calls the application's
		# /api/internal/tus hook itself, so the only thing nginx does here is
		# stream bytes through unbuffered.
		location /api/files {
			proxy_pass ${TUSD_URL};
			proxy_request_buffering  off;
			proxy_buffering          off;
			proxy_http_version       1.1;
			# The browser's original Host, forwarded by the web edge, so tusd
			# hands back Location headers the client can actually follow.
			proxy_set_header X-Forwarded-Host $http_host;
			proxy_set_header X-Forwarded-Proto $scheme;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection "upgrade";
			client_max_body_size     0;
		}

		# Live HLS segments written by the rtmp block below. The .m3u8 playlist
		# is *not* served from here: the application rewrites it per request
		# (/api/live/{id}.m3u8) to count viewers, so it is denied on this side.
		location /live {
			add_header Access-Control-Allow-Origin *;
			add_header Cache-Control no-cache;
			expires -1;
			alias /app/public/live;
			proxy_cache_bypass 1;
			location ~\.m3u8$ {
				deny all;
				return 404;
			}
			types {
				video/mp2t ts;
			}
		}

		vod_mode mapped;
		vod_upstream_location /videos-upstream;
		vod_cache_buffer_size 1m;
		vod_metadata_cache metadata_cache 512m;
		#vod_response_cache response_cache 128m;
		#vod_mapping_cache mapping_cache 5m;

		location ~ ^/videos-hls {
			vod hls;
			add_header Access-Control-Allow-Headers '*';
			add_header Access-Control-Expose-Headers 'Server,range,Content-Length,Content-Range';
			add_header Access-Control-Allow-Methods 'GET, HEAD, OPTIONS';
			add_header Access-Control-Allow-Origin '*';
			expires 100d;
		}

		# vod_mode mapped asks the application where a video lives on disk; the
		# answer is a path under /app/public/media, which this container has
		# mounted read-only.
		location /videos-upstream {
			internal;
			proxy_pass ${APP_INTERNAL_URL}/api/internal/videos-upstream;
		}

		# rtmp-module control surface: start and stop recordings, read stats.
		# INTERNAL_ALLOW is the whole of the authentication here, so set it to
		# the application's address rather than leaving it at a private range
		# when the two are in different locations.
		location /internal {
			allow ${INTERNAL_ALLOW};
			allow 127.0.0.1;
			deny all;
			location /internal/control {
				rtmp_control all;
			}
			location /internal/stat {
				rtmp_stat all;
				rtmp_stat_stylesheet stat.xsl;
			}
		}
	}
}

rtmp {
	# Nothing here relays or pushes to another RTMP server, and the module
	# refuses to start with verification on but no trust store configured.
	rtmp_relay_ssl_verify off;

	server {
		listen 1935;
		chunk_size 4096;
		application live {
			live on;
			hls on;
			hls_fragment_naming system;
			hls_path /app/public/live;
			hls_nested on;
			hls_fragment 8s;
			hls_playlist_length 32s;
			on_publish ${APP_INTERNAL_URL}/api/internal/stream/on-publish;
			on_publish_done ${APP_INTERNAL_URL}/api/internal/stream/on-publish-done;

			recorder main {
				record all manual;
				record_path /app/storage/temp-recordings;
				record_suffix -%d.mp4;
				record_unique on;
				exec_record_done curl ${APP_INTERNAL_URL}/api/internal/stream/on-record-done?filename=$filename;
			}
		}
	}
}

worker_processes  1;

events {
    worker_connections  1024;
}


http {
    include       mime.types;
    default_type  application/octet-stream;
    access_log off;
    sendfile        on;
    keepalive_timeout  65;

	map $http_upgrade $connection_upgrade {
		default upgrade;
		''      close;
	}

    server {
        listen       80;
        server_name  localhost;
		root         /backend/public;
		index        index.php;
	    client_max_body_size 10m;
	    error_page   500 502 503 504  /50x.html;

		# Built SPA assets are content-hashed, so they can be cached forever.
		location /_nuxt/ {
			expires 1y;
			add_header Cache-Control "public, immutable";
		}

		# Static files straight off disk; everything else goes to Laravel,
		# whose fallback route returns the SPA shell.
		location / {
			try_files $uri $uri/ /index.php?$query_string;
			location /api/files {
				proxy_pass http://tusd:1080;
        		proxy_request_buffering  off;
        		proxy_buffering          off;
        		proxy_http_version       1.1;
        		proxy_set_header X-Forwarded-Host $host;
        		proxy_set_header X-Forwarded-Proto $scheme;
        		proxy_set_header         Upgrade $http_upgrade;
        		proxy_set_header         Connection "upgrade";
        		client_max_body_size     0;
			}
		}

		location ~ \.php$ {
			fastcgi_pass   php:9000;
			fastcgi_index  index.php;
			include        fastcgi_params;
			fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
			fastcgi_param  DOCUMENT_ROOT   $document_root;
			fastcgi_read_timeout 300;
		}

		location ~ ^/(assets|uploads|media|thumbnails)/ {
			add_header Access-Control-Allow-Origin *;
			if ($request_method = OPTIONS) {
			    add_header Content-Length 0;
			    add_header Content-Type text/plain;
			    add_header "Access-Control-Allow-Origin" *;
			    add_header "Access-Control-Allow-Methods" "GET, POST, OPTIONS, HEAD";
			    add_header "Access-Control-Allow-Headers" "Authorization, Origin, X-Requested-With, Content-Type, Accept";
			    return 200;
			}
		}

		location ~* \.io {
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header Host $http_host;
			proxy_set_header X-NginX-Proxy false;
			proxy_pass http://echo:6001;
			proxy_redirect off;
			proxy_http_version 1.1;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection "upgrade";
		}

        location = /50x.html {
            root   html;
        }

		location /internal {
		    allow 172.16.0.0/12;
			allow 127.0.0.1;
			deny all;
			location /internal/control {
				rtmp_control all;
			}
			location /internal/stat {
				rtmp_stat all;
				rtmp_stat_stylesheet stat.xsl;
			}
		}

        location /live {
			add_header Access-Control-Allow-Origin *;
			add_header Cache-Control no-cache;
			expires -1;
            alias /backend/public/live;
			proxy_cache_bypass 1;
			location ~\.m3u8$ {
                deny all;
                return 404;
            }
			types {
				video/mp2t ts;
			}
		}

        vod_mode mapped;
        vod_upstream_location /videos-upstream;
        vod_cache_buffer_size 1m;
        vod_metadata_cache metadata_cache 512m;
      	#vod_response_cache response_cache 128m;
      	#vod_mapping_cache mapping_cache 5m;

        location ~ ^/videos-hls {
        	vod hls;
        	add_header Access-Control-Allow-Headers '*';
        	add_header Access-Control-Expose-Headers 'Server,range,Content-Length,Content-Range';
        	add_header Access-Control-Allow-Methods 'GET, HEAD, OPTIONS';
        	add_header Access-Control-Allow-Origin '*';
        	expires 100d;
        }

		# php-fpm speaks FastCGI, not HTTP, so the VOD module's upstream request
		# is sent back through this server rather than straight to the app.
       	location /videos-upstream {
        	internal;
        	proxy_pass http://127.0.0.1:80/api/internal/videos-upstream;
       	}

    }
}

rtmp {
	server {
		listen 1935;
		chunk_size 4096;
		application live {
			live on;
			hls on;
			hls_fragment_naming system;
			hls_path /backend/public/live;
			hls_nested on;
			hls_fragment 8s;
			hls_playlist_length 32s;
			# Same reason as /videos-upstream: these callbacks go through nginx.
			on_publish http://127.0.0.1:80/api/internal/stream/on-publish;
			on_publish_done http://127.0.0.1:80/api/internal/stream/on-publish-done;

			recorder main {
				record all manual;
				record_path /backend/storage/temp-recordings;
				record_suffix -%d.mp4;
				record_unique on;
				exec_record_done curl http://127.0.0.1:80/api/internal/stream/on-record-done?filename=$filename;
			}
		}
	}
}

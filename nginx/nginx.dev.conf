# Web edge, development. The Nuxt dev server owns the app shell and its assets
# so that HMR works; Laravel only sees /api and the federation endpoints.
# Streaming (RTMP, HLS, VOD, uploads) is a separate container -- see
# ../streaming. Production variant: nginx.prod.conf.

worker_processes  1;

events {
	worker_connections  1024;
}

http {
	include       mime.types;
	default_type  application/octet-stream;
	access_log off;
	sendfile        on;
	keepalive_timeout  65;

	map $http_upgrade $connection_upgrade {
		default upgrade;
		''      close;
	}

	# Only needed by the streaming shims at the bottom of this file, which
	# resolve their target per request rather than at startup. Without that,
	# the two edges would each refuse to boot until the other was up.
	resolver ${DNS_RESOLVER} ipv6=off valid=10s;

	server {
		listen       80;
		server_name  localhost;
		root         /backend/public;
		index        index.php;
		client_max_body_size 10m;
		error_page   500 502 503 504  /50x.html;

		location / {
			proxy_pass http://nuxt:3000;
			proxy_set_header Host $http_host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
			proxy_http_version 1.1;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection $connection_upgrade;
			proxy_cache_bypass $http_upgrade;
			proxy_read_timeout 900;
			proxy_buffering off;
			add_header X-Accel-Buffering no;
			client_max_body_size 0;
		}

		location /api {
			try_files $uri /index.php?$query_string;
		}

		location /.well-known {
			try_files $uri /index.php?$query_string;
		}

		location ~ \.php$ {
			fastcgi_pass   php:9000;
			fastcgi_index  index.php;
			include        fastcgi_params;
			fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
			fastcgi_param  DOCUMENT_ROOT   $document_root;
			fastcgi_read_timeout 300;
		}

		location ~ ^/(assets|uploads|media|thumbnails)/ {
			add_header Access-Control-Allow-Origin *;
			if ($request_method = OPTIONS) {
				add_header Content-Length 0;
				add_header Content-Type text/plain;
				add_header "Access-Control-Allow-Origin" *;
				add_header "Access-Control-Allow-Methods" "GET, POST, OPTIONS, HEAD";
				add_header "Access-Control-Allow-Headers" "Authorization, Origin, X-Requested-With, Content-Type, Accept";
				return 200;
			}
		}

		location ~* \.io {
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header Host $http_host;
			proxy_set_header X-NginX-Proxy false;
			proxy_pass http://echo:6001;
			proxy_redirect off;
			proxy_http_version 1.1;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection "upgrade";
		}

		location = /50x.html {
			root   /usr/share/nginx/html;
		}

		# --- streaming shims -------------------------------------------------
		# Transitional: the client still asks this origin for segments, VOD
		# playlists and uploads, so they are forwarded to the streaming edge.
		# Point HLS_URL (and the uploader's endpoint) at the streaming host
		# directly and these three locations can go, along with the resolver
		# above -- that is what lets streaming move to its own machine.
		location /live {
			set $streaming ${STREAMING_INTERNAL_URL};
			proxy_pass $streaming$request_uri;
			proxy_set_header Host $http_host;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
		}

		location ~ ^/videos-hls {
			set $streaming ${STREAMING_INTERNAL_URL};
			proxy_pass $streaming$request_uri;
			proxy_set_header Host $http_host;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
		}

		location /api/files {
			set $streaming ${STREAMING_INTERNAL_URL};
			proxy_pass $streaming$request_uri;
			proxy_request_buffering  off;
			proxy_buffering          off;
			proxy_http_version       1.1;
			proxy_set_header Host $http_host;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection "upgrade";
			client_max_body_size     0;
		}
	}
}
